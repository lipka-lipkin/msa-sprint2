# Feature flag на уровне Envoy: Lua-фильтр в ingress gateway превращает клиентский заголовок
# X-Feature-Enabled: true во внутреннюю метку маршрута x-booking-route: v2.
# VirtualService (virtual-service.yaml) по этой метке отправляет запрос в subset v2.
# Клиентское значение x-booking-route всегда удаляется — подделать маршрут снаружи нельзя
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: booking-feature-flag
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: hotelio.booking.feature_flag
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            default_source_code:
              inline_string: |
                function envoy_on_request(request_handle)
                  local headers = request_handle:headers()
                  headers:remove("x-booking-route")
                  local flag = headers:get("x-feature-enabled")
                  if flag ~= nil and string.lower(flag) == "true" then
                    headers:add("x-booking-route", "v2")
                  end
                  -- Маршрут мог быть выбран до этого фильтра: пересчитываем с новым заголовком
                  request_handle:clearRouteCache()
                end

                function envoy_on_response(response_handle)
                  response_handle:headers():add("x-feature-flag-filter", "applied")
                end
